[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcpu"
version = "0.1.0"
description = "A computational state-space architecture for describing, interpreting, and navigating computation through typed Grounds, observers, and distributed realizers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kieran Vanderburgh", email = "Kier73research@gmail.com" }]
keywords = [
  "virtual-machine",
  "determinism",
  "message-passing",
  "capability-security",
  "information-logistics",
  "state-space-navigation",
  "computational-ground",
  "symbolic-computation",
  "semantic-translation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Emulators",
  "Topic :: System :: Virtual Machines",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "numpy>=2.3"]
vgi = [
  "virtual-ground-interpreter @ git+https://github.com/Kier73/Virtual-Ground-Interpreter.git@7a3c4a368d1d24044a6c06a317c26ef316513e6d#subdirectory=virtual_ground_interpreter",
]

[project.urls]
Homepage = "https://github.com/Kier73/E-CPU"
Repository = "https://github.com/Kier73/E-CPU"
Issues = "https://github.com/Kier73/E-CPU/issues"

[project.scripts]
mailcpu = "mailcpu.cli:main"
mailcpu-recovery-authority = "mailcpu.recovery_lineage_service:main"
mailcpu-computational-fabric-peer = "mailcpu.computational_fabric_service:main"
mailcpu-recovery-topology = "mailcpu.recovery_deployment:main"

[tool.setuptools]
packages = ["mailcpu"]

[tool.setuptools.package-data]
mailcpu = ["py.typed", "ai_ground_atlas.v1.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]