name: IPS-001 intention-first communication synthesis

on:
  pull_request:
    paths:
      - 'mailcpu/intention_phase_synthesis.py'
      - 'tests/test_intention_phase_synthesis.py'
      - 'docs/INTENTION_PHASE_SYNTHESIS_IPS001.md'
      - '.github/workflows/intention-phase-synthesis.yml'
  push:
    branches:
      - research/intention-phase-synthesis-ips001
    paths:
      - 'mailcpu/intention_phase_synthesis.py'
      - 'tests/test_intention_phase_synthesis.py'
      - '.github/workflows/intention-phase-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-replay:
    name: Exact CRT and real E-CPU route gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native runtime and test runner
        run: python -m pip install -e '.[dev]'
      - name: Verify exact intention-phase synthesis and native resolver regression
        run: python -m pytest -q tests/test_intention_phase_synthesis.py tests/test_evidence_path_resolver.py
