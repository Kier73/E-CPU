name: FAB-011 live CPU observations
on:
  pull_request:
    paths:
      - 'examples/fab_127/fab011*'
      - 'examples/fab_127/verify_fab011.py'
      - 'mailcpu/law_certifier.py'
      - '.github/workflows/fab011-loopback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: cc -O3 -std=c11 -Wall -Wextra -Werror -pthread examples/fab_127/fab011.c -o /tmp/fab011
      - run: |
          /tmp/fab011 examples/fab_127/fab011-programs.txt 24 3 4 > fab011-full.txt
          python examples/fab_127/verify_fab011.py examples/fab_127/fab011-programs.txt fab011-full.txt --native-law
      - run: |
          /tmp/fab011 examples/fab_127/fab011-alternate.txt 18 3 2 native > fab011-alternate.txt
          python examples/fab_127/verify_fab011.py examples/fab_127/fab011-alternate.txt fab011-alternate.txt --native-law
          /tmp/fab011 examples/fab_127/fab011-alternate.txt 4 1 3 > fab011-tiny.txt
          python examples/fab_127/verify_fab011.py examples/fab_127/fab011-alternate.txt fab011-tiny.txt --native-law
      - run: |
          printf 'ADD 1\nJUMP 1\nEND\n' > /tmp/fab011-bad.txt
          if /tmp/fab011 /tmp/fab011-bad.txt 12 3 4; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab011-live
          path: fab011-*.txt
