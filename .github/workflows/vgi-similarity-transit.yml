name: VGI similarity structural memory over E-CPU Transit
on:
  pull_request:
    paths:
      - 'mailcpu/vgi_similarity_host.py'
      - 'mailcpu/vgi_similarity_native_memory.py'
      - 'tests/test_vgi_similarity_native_memory.py'
      - 'examples/verify_native_similarity_revision.py'
      - 'docs/VGI_SIMILARITY_NATIVE_MEMORY.md'
      - 'mailcpu/transit_vgi_similarity.py'
      - 'tests/test_vgi_similarity_host.py'
      - 'tests/test_vgi_similarity_transit_recovery.py'
      - 'tests/test_vgi_similarity_native_transit_recovery.py'
      - 'tests/helpers/vgi_similarity_native_continuity_worker.py'
      - 'tests/helpers/vgi_similarity_continuity_worker.py'
      - 'examples/vgi_similarity_transfer_process.py'
      - '.github/workflows/vgi-similarity-transit.yml'
  push:
    paths:
      - 'mailcpu/vgi_similarity_host.py'
      - 'mailcpu/vgi_similarity_native_memory.py'
      - 'tests/test_vgi_similarity_native_memory.py'
      - 'examples/verify_native_similarity_revision.py'
      - 'docs/VGI_SIMILARITY_NATIVE_MEMORY.md'
      - 'mailcpu/transit_vgi_similarity.py'
      - 'tests/test_vgi_similarity_host.py'
      - 'tests/test_vgi_similarity_transit_recovery.py'
      - 'tests/test_vgi_similarity_native_transit_recovery.py'
      - 'tests/helpers/vgi_similarity_native_continuity_worker.py'
      - 'tests/helpers/vgi_similarity_continuity_worker.py'
      - 'examples/vgi_similarity_transfer_process.py'
      - '.github/workflows/vgi-similarity-transit.yml'
permissions:
  contents: read
jobs:
  similarity-transit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E-CPU and exact experimental VGI dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'git+https://github.com/Kier73/Virtual-Ground-Interpreter.git@30732bc4ba42c9555ab30fad21eb7b3778fb966b#subdirectory=virtual_ground_interpreter'
          python -c 'from vgi.structural_memory import admit_similarity_memory; print("GEOMETRY-FIRST-008 present")'
      - name: Test mathematical transfer across distinct OS processes
        run: |
          python examples/vgi_similarity_transfer_process.py experiment
          python examples/vgi_similarity_transfer_process.py negative
      - name: Test real E-CPU Virtual Layer and post-commit Transit recovery
        run: |
          python -m pytest -q -v tests/test_vgi_similarity_host.py tests/test_vgi_similarity_native_memory.py tests/test_vgi_similarity_transit_recovery.py tests/test_vgi_similarity_native_transit_recovery.py