name: MailCPU semantic and quorum audit

on:
  pull_request:
    paths:
      - "mailcpu/model.py"
      - "mailcpu/interpreter.py"
      - "mailcpu/programs.py"
      - "mailcpu/assembler.py"
      - "mailcpu/seed_commit_quorum.py"
      - "tests/test_conformance.py"
      - "tests/test_assembler.py"
      - "tests/test_seed_commit_quorum.py"
      - ".github/workflows/mailcpu-semantic-quorum-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audit dependencies
        run: python -m pip install -e . pytest
      - name: Differential interpreter and quorum durability regressions
        run: >-
          python -m pytest -q
          tests/test_conformance.py
          tests/test_assembler.py
          tests/test_seed_commit_quorum.py
          tests/test_seed_commit_coordinator.py
          tests/test_seed_input.py
