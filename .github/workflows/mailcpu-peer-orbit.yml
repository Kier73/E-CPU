name: MailCPU peer orbit and recurrence

on:
  pull_request:
    paths:
      - "mailcpu/affine_orbit.py"
      - "mailcpu/recurrence_observer.py"
      - "tests/test_affine_orbit.py"
      - "tests/test_recurrence_observer.py"
      - "tests/test_peer_audit_probes.py"
      - "docs/PEER_001_AFFINE_ORBIT_RECURRENCE.md"
      - ".github/workflows/mailcpu-peer-orbit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-orbit:
    name: peer orbit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Peer orbit, recurrence, and audit regressions
        run: >-
          python -m pytest -q
          tests/test_affine_orbit.py
          tests/test_recurrence_observer.py
          tests/test_peer_audit_probes.py
          tests/test_conformance.py
          tests/test_assembler.py
