name: COUNTED-004 feedback and event-count oracle

on:
  pull_request:
    paths:
      - "mailcpu/counted_observer_stream.py"
      - "mailcpu/__init__.py"
      - "tests/test_counted_observer_stream.py"
      - "docs/COUNTED_004_FEEDBACK_EVENT_NAVIGATION.md"
      - ".github/workflows/count-feedback-stream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counted-feedback:
    name: counted feedback (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install E-CPU tests
        run: python -m pip install ".[dev]"
      - name: Compile counted source and tests
        run: python -m compileall -q mailcpu/counted_observer_stream.py tests/test_counted_observer_stream.py
      - name: Verify nonsettling feedback, conditional output, and existing oracles
        run: >-
          python -m pytest -q
          tests/test_counted_observer_stream.py
          tests/test_intention_formed_fabric.py
          tests/test_nonlinear_output_lift_probe.py
          tests/test_affine_stream.py
