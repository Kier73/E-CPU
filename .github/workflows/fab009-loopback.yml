name: FAB-009 full loopback parallel address space
on:
  pull_request:
    paths:
      - 'examples/fab_127/fab009.c'
      - 'examples/fab_127/verify_fab009.py'
      - 'mailcpu/law_certifier.py'
      - '.github/workflows/fab009-loopback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-full-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: cc -O3 -Wall -Wextra -Werror examples/fab_127/fab009.c -o /tmp/fab009
      - run: /tmp/fab009 4 32 64 0 1 193
      - run: /tmp/fab009 4 256 256 0 1 1 > fab009-full.txt
      - run: python examples/fab_127/verify_fab009.py /tmp/fab009 fab009-full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fab009-full
          path: fab009-full.txt
