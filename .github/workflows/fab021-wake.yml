name: FAB-021 endogenous wake attention
on:
  pull_request:
    paths:
      - 'mailcpu/wake_attention.py'
      - 'mailcpu/replicated_mailbox.py'
      - 'mailcpu/computational_session.py'
      - 'tests/test_wake_attention.py'
      - '.github/workflows/fab021-wake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: |
          set -o pipefail
          python -m pytest -vv -s tests/test_wake_attention.py tests/test_head_attention.py tests/test_computational_transition.py tests/test_attention.py | tee fab021-native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab021-native
          path: fab021-native.txt
