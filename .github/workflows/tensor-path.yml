name: TENSOR-PATH-001 SIMT and path-transfer tensor regressions
on:
  pull_request:
    paths:
      - 'mailcpu/transit_simt.py'
      - 'mailcpu/egpu.py'
      - 'mailcpu/tensor_stream.py'
      - 'mailcpu/tensor_checkpoint.py'
      - 'mailcpu/checkpoint.py'
      - 'tests/test_tensor_checkpoint.py'
      - 'tests/test_checkpoint.py'
      - 'mailcpu/path_tensor.py'
      - 'tests/test_tensor_paths.py'
      - '.github/workflows/tensor-path.yml'
  push:
    branches: [main]
    paths:
      - 'mailcpu/transit_simt.py'
      - 'mailcpu/egpu.py'
      - 'mailcpu/tensor_stream.py'
      - 'mailcpu/tensor_checkpoint.py'
      - 'mailcpu/checkpoint.py'
      - 'tests/test_tensor_checkpoint.py'
      - 'tests/test_checkpoint.py'
      - 'mailcpu/path_tensor.py'
      - 'tests/test_tensor_paths.py'
      - '.github/workflows/tensor-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tensor-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Verify SIMT and E-GPU reference and path-transfer tensor realizations
        run: python -m pytest -q tests/test_tensor_paths.py tests/test_tensor_checkpoint.py tests/test_checkpoint.py tests/test_egpu.py tests/test_path_ground_probe.py
      - name: Repository conformance and syntax
        run: |
          python -m compileall -q mailcpu
          python scripts/verify_repo.py
