name: HFG-002 real pretrained layer and E-CPU Ground execution

on:
  pull_request:
    paths:
      - 'mailcpu/hf_model_ground.py'
      - 'mailcpu/hf_layer_realization.py'
      - 'tests/test_hf_layer_realization.py'
      - 'examples/hf_pretrained_qwen3_layer.py'
      - 'examples/hf_pinned_qwen3_dense_config.json'
      - 'docs/HF_PRETRAINED_LAYER_HFG002.md'
      - '.github/workflows/hf-pretrained-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real MailCPU and numerical verifiers
        run: |
          python -m pip install -e '.[dev]' numpy
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Pinned HFG/MWS regression and authorization tests
        run: |
          python -m pytest -q tests/test_hf_model_ground.py tests/test_hf_layer_realization.py
          python -m pytest -q tests/test_model_weight_ground.py
      - name: Check pinned Qwen3 structure without pretending to load weights
        run: |
          python - <<'PY'
          import json
          from mailcpu.hf_model_ground import HFModelGround
          j=json.load(open('examples/hf_pinned_qwen3_dense_config.json'))
          model=HFModelGround(j['repository'],j['revision'],j['config'])
          assert model.family=='qwen3'
          assert len(tuple(model.layers()))==28
          assert model.layer_kind(0)=='dense_mlp'
          assert model.to_dict()['weights_fully_verified'] is False
          print('Qwen3 Ground is addressable; no pretrained payload claimed.')
          PY

  actual-huggingface-weights:
    runs-on: ubuntu-latest
    needs: semantic-and-native
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: Kier73/In-Formation-Space
          ref: c9716242725be65937fda1dd7b6cb778ca1def91
          path: external/In-Formation-Space
      - name: Install E-CPU numerical Ground and independent Torch checker
        run: |
          python -m pip install -e . numpy
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Observe exact pinned checkpoint and fetch only required layer bytes
        env:
          PYTHONPATH: .
        run: |
          python examples/hf_pretrained_qwen3_layer.py \
            --ifs-root external/In-Formation-Space \
            --native \
            --layer 0 \
            --output /tmp/hfg002-real-pretrained-layer.json
      - name: Confirm full E-CPU DAG and actual parameter evidence
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/hfg002-real-pretrained-layer.json'))
          assert x['repository']=='Qwen/Qwen3-0.6B'
          assert x['revision']=='167b8104f88905a951069f5f95f9776908da5f68'
          assert x['selected_tensor_count']==11
          assert x['selected_tensor_bytes']>1_000_000
          assert x['numeric_result']['dag_complete']
          assert x['numeric_result']['independent_reference_checked']
          assert x['numeric_result']['layer_math_executed']
          assert not x['full_model_forward_executed']
          assert not x['weight_data_embedded_in_report']
          print('Pinned selected pretrained tensors used by real E-CPU neural operators.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hfg002-pinned-real-weights-check-no-payloads
          path: /tmp/hfg002-real-pretrained-layer.json
          retention-days: 14
