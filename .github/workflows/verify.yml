name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push and its associated PR use the same head-branch group. Keep the
# newest verification attempt; stale queued matrices cannot validate HEAD.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: specification gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        id: install
        run: python -m pip install --upgrade pip pytest

      - name: Enable long paths for pinned VGI checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install pinned VGI integration
        id: install_vgi
        run: python -m pip install ".[vgi]"

      - name: Verify VGI Ground
        run: python -m vgi verify

      - name: Test suite
        run: python -m pytest -q

      - name: Focused VM fleet verification
        if: always() && steps.install.conclusion == 'success'
        run: python -m pytest -q tests/test_vm_fleet_capacity.py

      - name: Measure independent VM fleet capacity
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >-
          python scripts/benchmark_vm_fleet.py
          --vm-counts 1,2,4,8
          --work-units 64
          --working-set-pages 2
          --pretty
          --output vm-fleet-capacity.json

      - name: Upload VM fleet capacity report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: vm-fleet-capacity-report
          path: vm-fleet-capacity.json
          if-no-files-found: warn

      - name: Measure persistent VGI fabric transfer
        if: success() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pytest -q -s tests/test_computational_fabric.py::test_persistent_vgi_session_transfers_through_fabric_and_replays_once

      - name: Invariant registry
        if: always() && steps.install.conclusion == 'success' && steps.install_vgi.conclusion == 'success'
        run: python scripts/verify_invariants.py

      - name: Repository conformance
        if: always() && steps.install.conclusion == 'success' && steps.install_vgi.conclusion == 'success'
        run: python scripts/verify_repo.py

  package:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Confirm the private workspace is excluded from the distribution
        run: |
          set -euo pipefail
          tar -tzf dist/*.tar.gz > "$RUNNER_TEMP/mailcpu-sdist-files.txt"
          if grep -q '/_dev/' "$RUNNER_TEMP/mailcpu-sdist-files.txt"; then
            echo "the distribution contains _dev/; this is a packaging defect"
            exit 1
          fi
          grep -q 'mailcpu/__init__.py' "$RUNNER_TEMP/mailcpu-sdist-files.txt"
