name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: specification gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Test suite
        run: python -m pytest -q

      - name: Invariant registry
        run: python scripts/verify_invariants.py

      - name: Repository conformance
        run: python scripts/verify_repo.py

  package:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Confirm the private workspace is excluded from the distribution
        run: |
          set -euo pipefail
          if tar -tzf dist/*.tar.gz | grep -q '/_dev/'; then
            echo "the distribution contains _dev/; this is a packaging defect"
            exit 1
          fi
          tar -tzf dist/*.tar.gz | grep -q 'mailcpu/__init__.py'