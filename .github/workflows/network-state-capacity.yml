name: Network-state capacity and neural Ground realization
on:
  push:
    paths:
      - 'mailcpu/network_state_capacity.py'
      - 'tests/test_network_state_capacity.py'
      - 'examples/run_network_state_capacity.py'
      - '.github/workflows/network-state-capacity.yml'
  pull_request:
    paths:
      - 'mailcpu/network_state_capacity.py'
      - 'tests/test_network_state_capacity.py'
      - 'examples/run_network_state_capacity.py'
      - '.github/workflows/network-state-capacity.yml'
  workflow_dispatch:
jobs:
  exact-network-ground:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the E-CPU project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Exercise the native network, exact law and neural compiler
        run: |
          python -m pytest -q tests/test_network_state_capacity.py tests/test_transition_space.py tests/test_stateful_transition.py tests/test_transit_path_modes.py tests/test_observer_path_evidence.py
      - name: Reproduce the capacity and ReLU experiment
        run: |
          python -m examples.run_network_state_capacity