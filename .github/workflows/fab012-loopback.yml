name: FAB-012 effectful navigation
on:
  pull_request:
    paths:
      - 'examples/fab_127/fab012.c'
      - 'examples/fab_127/verify_fab012.py'
      - 'docs/FAB_012_EFFECTFUL_NAVIGATION.md'
      - 'mailcpu/law_certifier.py'
      - '.github/workflows/fab012-loopback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: cc -O3 -std=c11 -Wall -Wextra -Werror -pthread examples/fab_127/fab012.c -o /tmp/fab012
      - run: |
          /tmp/fab012 24 4 3 8 > fab012-literal.txt
          /tmp/fab012 24 4 3 8 leap > fab012-leap.txt
          python examples/fab_127/verify_fab012.py fab012-literal.txt fab012-leap.txt --native-law
      - run: |
          /tmp/fab012 16 4 2 1024 > fab012-long-literal.txt
          /tmp/fab012 16 4 2 1024 leap > fab012-long-leap.txt
          python examples/fab_127/verify_fab012.py fab012-long-literal.txt fab012-long-leap.txt --native-law
      - run: |
          for w in 1 3 16; do
            /tmp/fab012 12 "$w" 3 8 leap > fab012-worker-"$w".txt
            python examples/fab_127/verify_fab012.py fab012-worker-"$w".txt --native-law
          done
          /tmp/fab012 4 3 1 1 leap > fab012-tiny.txt
          python examples/fab_127/verify_fab012.py fab012-tiny.txt --native-law
          if /tmp/fab012 12 4 3 8 tamper > fab012-tamper.txt 2>&1; then exit 1; fi
          grep -q 'FAIL: oracle receive mismatch' fab012-tamper.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab012-evidence
          path: fab012-*.txt
