name: ITR-001 intention to verified realization

on:
  pull_request:
    paths:
      - 'mailcpu/intention_realization_latency.py'
      - 'mailcpu/intention_realization_metrics.py'
      - 'tests/test_intention_realization_latency.py'
      - 'tests/test_intention_realization_metrics.py'
      - 'examples/intention_realization_benchmark.py'
      - 'docs/INTENTION_TO_VERIFIED_REALIZATION_ITR001.md'
      - '.github/workflows/itr001-intention-latency.yml'
  push:
    branches: [main]
    paths:
      - 'mailcpu/intention_realization_latency.py'
      - 'mailcpu/intention_realization_metrics.py'
      - 'tests/test_intention_realization_latency.py'
      - 'tests/test_intention_realization_metrics.py'
      - 'examples/intention_realization_benchmark.py'
      - '.github/workflows/itr001-intention-latency.yml'

permissions:
  contents: read

jobs:
  discovery-time:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E-CPU native package and test driver
        run: python -m pip install -e . 'pytest>=8'
      - name: Verify actual formation and adversarial invariants
        run: python -m pytest -q tests/test_intention_realization_latency.py tests/test_intention_realization_metrics.py tests/test_observation_formed_processor.py tests/test_intention_formed_fabric.py
      - name: Benchmark identical goals through cold and retained Grounds
        run: python examples/intention_realization_benchmark.py --trials 3
