name: Continuous E-CPU session rejoin

on:
  push:
    branches: [main]
    paths:
      - 'mailcpu/continuous_session.py'
      - 'mailcpu/__init__.py'
      - 'tests/test_continuous_session.py'
      - '.github/workflows/continuous-session-rejoin.yml'
  pull_request:
    paths:
      - 'mailcpu/continuous_session.py'
      - 'mailcpu/__init__.py'
      - 'tests/test_continuous_session.py'
      - '.github/workflows/continuous-session-rejoin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-rejoin:
    name: observer-host rejoin (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - name: Compile continuous session and test
        run: python -m compileall -q mailcpu/continuous_session.py tests/test_continuous_session.py
      - name: Verify persistent M3 and observer bootstrap
        run: python -m pytest -q tests/test_continuous_session.py tests/test_computational_session.py tests/test_substrate_bootstrap.py
