name: IPS-008 authenticated effect receiver and durable handoff barrier

on:
  pull_request:
    paths:
      - 'mailcpu/fenced_effect_receiver.py'
      - 'mailcpu/effect_receiver_service.py'
      - 'tests/test_effect_receiver_service.py'
      - 'tests/test_effect_receiver_connection_scope.py'
      - 'tests/helpers/ips008_effect_service_worker.py'
      - 'docs/RECEIVER_HANDOFF_BARRIER_IPS008.md'
      - '.github/workflows/ips008-receiver-handoff.yml'
  push:
    branches:
      - research/ips008-effect-barrier-service
    paths:
      - 'mailcpu/fenced_effect_receiver.py'
      - 'mailcpu/effect_receiver_service.py'
      - 'tests/test_effect_receiver_service.py'
      - 'tests/test_effect_receiver_connection_scope.py'
      - 'tests/helpers/ips008_effect_service_worker.py'
      - '.github/workflows/ips008-receiver-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-receiver-handoff:
    name: Native mTLS effect receiver, durable barrier, hard crash recovery
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E-CPU native tests
        run: python -m pip install -e '.[dev]'
      - name: Verify IPS-008 service, IPS-007 atomic effects and IPS-005 lineage
        run: >
          python -m pytest -q
          tests/test_effect_receiver_service.py
          tests/test_effect_receiver_connection_scope.py
          tests/test_fenced_effect_receiver.py
          tests/test_fenced_generated_ground.py
          tests/test_recovery_lineage.py
