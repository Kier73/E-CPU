name: IPS-002 inverse architecture synthesis

on:
  pull_request:
    paths:
      - 'mailcpu/inverse_architecture_synthesis.py'
      - 'tests/test_inverse_architecture_synthesis.py'
      - 'docs/INVERSE_ARCHITECTURE_SYNTHESIS_IPS002.md'
      - '.github/workflows/inverse-architecture-synthesis.yml'
  push:
    branches:
      - research/inverse-architecture-synthesis-ips002
    paths:
      - 'mailcpu/inverse_architecture_synthesis.py'
      - 'tests/test_inverse_architecture_synthesis.py'
      - '.github/workflows/inverse-architecture-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-inverse-architecture:
    name: Native evidence and inverse phase gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native E-CPU and tests
        run: python -m pip install -e '.[dev]'
      - name: Verify architecture synthesis and established routing
        run: python -m pytest -q tests/test_inverse_architecture_synthesis.py tests/test_intention_phase_synthesis.py tests/test_evidence_path_resolver.py
