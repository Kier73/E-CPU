name: IPS-003 generative Ground construction

on:
  pull_request:
    paths:
      - 'mailcpu/generative_ground_construction.py'
      - 'tests/test_generative_ground_construction.py'
      - 'docs/GENERATIVE_GROUND_CONSTRUCTION_IPS003.md'
      - '.github/workflows/generative-ground-construction.yml'
  push:
    branches:
      - research/generative-ground-construction-ips003
    paths:
      - 'mailcpu/generative_ground_construction.py'
      - 'tests/test_generative_ground_construction.py'
      - '.github/workflows/generative-ground-construction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ground-construction:
    name: Inverse compiler and native gate/DAG verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E-CPU and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify IPS-003 and native DAG / Ground realizers
        run: python -m pytest -q tests/test_generative_ground_construction.py tests/test_inverse_architecture_synthesis.py tests/test_computation_dag.py tests/test_ground_native_realization.py
