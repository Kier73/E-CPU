name: IPS-005 quorum-fenced generated Ground

on:
  pull_request:
    paths:
      - 'mailcpu/fenced_generated_ground.py'
      - 'tests/test_fenced_generated_ground.py'
      - 'docs/FENCED_GENERATED_GROUND_IPS005.md'
      - '.github/workflows/fenced-generated-ground.yml'
  push:
    branches:
      - research/ips005-quorum-fenced-generated-ground
    paths:
      - 'mailcpu/fenced_generated_ground.py'
      - 'tests/test_fenced_generated_ground.py'
      - '.github/workflows/fenced-generated-ground.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-quorum-fenced-ground:
    name: Durable quorum and generated Ground fencing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install E-CPU and tests
        run: python -m pip install -e '.[dev]'
      - name: Verify fenced publication, mTLS recovery and prior native lineage
        run: python -m pytest -q tests/test_fenced_generated_ground.py tests/test_qualified_generated_ground.py tests/test_generative_ground_construction.py tests/test_recovery_lineage.py
