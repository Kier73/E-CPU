name: MGA-001-F discovered vocabulary
on:
  pull_request:
    paths:
      - 'mailcpu/affine_vocabulary.py'
      - 'mailcpu/affine_shared_continuation.py'
      - 'tests/test_affine_vocabulary.py'
      - '.github/workflows/mga001-vocabulary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocabulary:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_affine_vocabulary.py -v
      - run: python -m unittest discover -s tests -p test_affine_verification_ground.py -v
