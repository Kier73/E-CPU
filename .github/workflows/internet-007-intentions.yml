name: INTERNET-007 native intention ingress

on:
  pull_request:
    paths:
      - 'mailcpu/internet_intention_ingress.py'
      - 'tests/test_internet_intention_ingress.py'
      - 'intentions/internet007/**'
      - 'docs/INTERNET_007_ONLINE_INTENTIONS.md'
      - '.github/workflows/internet-007-intentions.yml'
  push:
    branches: [main]
    paths:
      - 'mailcpu/internet_intention_ingress.py'
      - 'tests/test_internet_intention_ingress.py'
      - 'intentions/internet007/**'
      - 'docs/INTERNET_007_ONLINE_INTENTIONS.md'
      - '.github/workflows/internet-007-intentions.yml'
  workflow_dispatch:
    inputs:
      intention_file:
        description: "Repository-committed, allowlisted public intention JSON path"
        required: true
        type: string
        default: intentions/internet007/public-source-grounds.json
      mode:
        description: "Explicit one-time initialization or one recoverable computation quantum"
        required: true
        type: choice
        options:
          - step
          - initialize
        default: step
  schedule:
    - cron: '29 */4 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install E-CPU and pytest
        run: python -m pip install -e . pytest
      - name: Verify intention admission and native recovery
        run: |
          python -m pytest -q \
            tests/test_internet_intention_ingress.py \
            tests/test_internet_quantum_continuation.py \
            tests/test_internet_fabric_dag.py \
            tests/test_computation_dag.py

  online:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: internet-005-state-branch
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      INTENTION_FILE: ${{ inputs.intention_file || 'intentions/internet007/public-source-grounds.json' }}
      MODE: ${{ inputs.mode || 'step' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install E-CPU
        run: python -m pip install -e .
      - name: Execute one explicitly budgeted computational quantum
        run: |
          python -m mailcpu.internet_intention_ingress \
            --live \
            --mode "$MODE" \
            --intention-file "$INTENTION_FILE" \
            --output internet007-result.json
      - name: Preserve exact online computational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internet007-${{ github.run_id }}
          path: internet007-result.json
          if-no-files-found: ignore

      - name: Admit at most one successor quantum
        if: success()
        id: next
        run: |
          python -m mailcpu.internet_quantum_continuation \
            --intention-file "$INTENTION_FILE" \
            --report internet007-result.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Request next independent hosted runner
        if: steps.next.outputs.dispatch == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/internet-007-intentions.yml/dispatches" \
            -f ref=main \
            -f "inputs[intention_file]=${INTENTION_FILE}" \
            -f "inputs[mode]=step" || {
              echo "::warning::Hosted continuation dispatch was refused. The existing state is retained for a manual or scheduled retry."
              exit 1
            }
