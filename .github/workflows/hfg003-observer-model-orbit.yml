name: HFG-003 two independent GitHub observer-hosts, one pretrained model Ground

on:
  pull_request:
    paths:
      - 'mailcpu/model_orbit_handoff.py'
      - 'mailcpu/hf_layer_realization.py'
      - 'tests/test_model_orbit_handoff.py'
      - 'examples/hf_orbit_observer_handoff.py'
      - 'docs/OBSERVER_HOST_MODEL_ORBIT_HFG003.md'
      - '.github/workflows/hfg003-observer-model-orbit.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ground-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact E-CPU branch and mathematical reference
        run: |
          python -m pip install -e '.[dev]' numpy
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Require real HeadlessOS / Hypervisor, not a local compatibility shim
        run: |
          python - <<'PY'
          import mailcpu
          from mailcpu.computational_objects import ComputationalObjectStore
          from mailcpu.hf_layer_realization import NativeQwen3LayerHost
          assert hasattr(mailcpu, 'HeadlessOS')
          assert hasattr(ComputationalObjectStore, 'read_bytes')
          PY
      - name: Validate both local contract and native operator/observer handoff
        run: python -m pytest -q tests/test_hf_layer_realization.py tests/test_model_orbit_handoff.py

  observer-a:
    runs-on: ubuntu-latest
    needs: ground-contract
    outputs:
      state_digest: ${{ steps.emit.outputs.state_digest }}
      native_receipt_digest: ${{ steps.emit.outputs.native_receipt_digest }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/In-Formation-Space
          ref: c9716242725be65937fda1dd7b6cb778ca1def91
          path: external/In-Formation-Space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native E-CPU + reference, no model inference package
        run: |
          python -m pip install -e . numpy
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute actual pinned pretrained layer 0 and retain M1 output
        id: emit
        env:
          PYTHONPATH: .
        run: |
          python examples/hf_orbit_observer_handoff.py produce \
            --ifs-root external/In-Formation-Space \
            --outgoing /tmp/hfg003-a \
            --job-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hfg003-receiver-a-model-ground-state-not-weights
          path: /tmp/hfg003-a
          retention-days: 7

  observer-b:
    runs-on: ubuntu-latest
    needs: observer-a
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/In-Formation-Space
          ref: c9716242725be65937fda1dd7b6cb778ca1def91
          path: external/In-Formation-Space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: hfg003-receiver-a-model-ground-state-not-weights
          path: /tmp/hfg003-received
      - name: Install E-CPU on new ephemeral observer-host
        run: |
          python -m pip install -e . numpy
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Independently bind Ground, verify predecessor and execute layer 1
        env:
          PYTHONPATH: .
          EXPECTED_HEAD: ${{ needs.observer-a.outputs.state_digest }}
          EXPECTED_RECEIPT: ${{ needs.observer-a.outputs.native_receipt_digest }}
        run: |
          python examples/hf_orbit_observer_handoff.py continue \
            --ifs-root external/In-Formation-Space \
            --incoming /tmp/hfg003-received \
            --outgoing /tmp/hfg003-b \
            --external-state-head "$EXPECTED_HEAD" \
            --external-native-receipt "$EXPECTED_RECEIPT"
      - name: Assert actual continuity rather than two unrelated jobs
        env:
          EXPECTED_HEAD: ${{ needs.observer-a.outputs.state_digest }}
        run: |
          python - <<'PY'
          import json,os
          previous=json.load(open('/tmp/hfg003-received/state.json'))
          current=json.load(open('/tmp/hfg003-b/state.json'))
          verifier=json.load(open('/tmp/hfg003-b/receipt.json'))
          assert previous['state_digest']==os.environ['EXPECTED_HEAD']
          assert current['predecessor_state_digest']==previous['state_digest']
          assert current['completed_layer']==1
          assert current['next_layer']==2
          assert current['model_descriptor']==previous['model_descriptor']
          assert verifier['independent_reference_checked']
          assert verifier['verified_source_ranges']
          assert not verifier['full_model_forward_executed']
          assert not verifier['path_native_tensor_arithmetic_proven']
          print('Distinct observer-hosts, one pinned model Ground, independent numerical work and retained state.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hfg003-receiver-b-continued-state-not-weights
          path: /tmp/hfg003-b
          retention-days: 7
