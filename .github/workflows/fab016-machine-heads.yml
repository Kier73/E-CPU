name: FAB-016 machine-head index and native density
on:
  pull_request:
    paths:
      - 'mailcpu/fabric_head_index.py'
      - 'tests/test_fabric_head_index.py'
      - 'tests/test_fab016_native_fleet.py'
      - 'examples/fab_127/benchmark_head_index.py'
      - '.github/workflows/fab016-machine-heads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -vv tests/test_fabric_head_index.py
      - run: python examples/fab_127/benchmark_head_index.py --bits 24 --report fab016-index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab016-index
          path: fab016-index.json
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: |
          set -o pipefail
          python -m pytest -vv -s tests/test_fab016_native_fleet.py | tee fab016-native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab016-native
          path: fab016-native.txt
