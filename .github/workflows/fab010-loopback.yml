name: FAB-010 stateful CPU fleet
on:
  pull_request:
    paths:
      - 'examples/fab_127/fab010.c'
      - 'examples/fab_127/verify_fab010.py'
      - 'mailcpu/law_certifier.py'
      - '.github/workflows/fab010-loopback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: cc -O3 -std=c11 -Wall -Wextra -Werror -pthread examples/fab_127/fab010.c -o /tmp/fab010
      - run: /tmp/fab010 --selftest
      - run: |
          for w in 1 3 4 16; do /tmp/fab010 12 "$w"; done
      - run: python examples/fab_127/verify_fab010.py /tmp/fab010
  native-full-space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: cc -O3 -std=c11 -Wall -Wextra -Werror -pthread examples/fab_127/fab010.c -o /tmp/fab010
      - run: /tmp/fab010 24 4 | tee fab010-full.txt
      - run: python examples/fab_127/verify_fab010.py /tmp/fab010 fab010-full.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab010-full
          path: fab010-full.txt
