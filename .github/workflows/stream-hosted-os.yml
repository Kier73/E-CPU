name: Stream-hosted HeadlessOS process continuity

on:
  push:
    paths:
      - "tests/test_stream_hosted_os.py"
      - "tests/test_stream_os_quorum.py"
      - "mailcpu/stream_os_session.py"
      - ".github/workflows/stream-hosted-os.yml"
  pull_request:
    paths:
      - "tests/test_stream_hosted_os.py"
      - "tests/test_stream_os_quorum.py"
      - "mailcpu/stream_os_session.py"
      - ".github/workflows/stream-hosted-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-over-tcp:
    name: Native OS / M3 quorum / TCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install E-CPU
        run: python -m pip install -e ".[dev,vgi]"
      - name: Test process migration, crash cuts and M3 quorum admission
        run: python -m pytest -q tests/test_stream_hosted_os.py tests/test_stream_os_quorum.py tests/test_computational_transition.py tests/test_computational_session.py
