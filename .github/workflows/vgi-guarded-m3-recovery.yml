name: Certified VGI durable M3 process recovery

on:
  pull_request:
    paths:
      - 'mailcpu/vgi_guarded_recovery.py'
      - 'tests/test_vgi_guarded_recovery.py'
      - 'tests/test_vgi_guarded_recovery_process.py'
      - 'examples/vgi_guarded_recovery_demo.py'
      - '.github/workflows/vgi-guarded-m3-recovery.yml'
  push:
    paths:
      - 'mailcpu/vgi_guarded_recovery.py'
      - 'tests/test_vgi_guarded_recovery.py'
      - 'tests/test_vgi_guarded_recovery_process.py'
      - 'examples/vgi_guarded_recovery_demo.py'
      - '.github/workflows/vgi-guarded-m3-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: 39a169b21513ffaaee85e40826c706c07a47215b
          path: external-vgi
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install E-CPU and source-pinned VGI
        run: |
          python -m pip install -e . pytest
          python -m pip install -e external-vgi/virtual_ground_interpreter
      - name: Verify quorum CAS, M1 admission, migration and process boundary
        run: |
          python -m pytest -q tests/test_vgi_guarded_recovery.py tests/test_vgi_guarded_recovery_process.py
      - name: Two real receiving processes, separate from pytest
        run: |
          mkdir -p "$RUNNER_TEMP/vgi-m3-process"
          python examples/vgi_guarded_recovery_demo.py bootstrap "$RUNNER_TEMP/vgi-m3-process"
          python examples/vgi_guarded_recovery_demo.py resume "$RUNNER_TEMP/vgi-m3-process"
