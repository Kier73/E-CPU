name: AI Ground Atlas — source-anchored contracts

on:
  pull_request:
    paths:
      - 'mailcpu/ai_ground_atlas.py'
      - 'mailcpu/ai_ground_atlas.v1.json'
      - 'tests/test_ai_ground_atlas.py'
      - 'docs/AI_COMPUTATIONAL_GROUND_ATLAS.md'
      - 'pyproject.toml'
      - '.github/workflows/ai-ground-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'mailcpu/ai_ground_atlas.py'
      - 'mailcpu/ai_ground_atlas.v1.json'
      - 'tests/test_ai_ground_atlas.py'
      - 'docs/AI_COMPUTATIONAL_GROUND_ATLAS.md'
      - 'pyproject.toml'
      - '.github/workflows/ai-ground-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-atlas:
    name: Ground descriptions and native representation (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test canonical source-anchored catalog and native E-CPU references
        run: python -m unittest discover -s tests -p 'test_ai_ground_atlas.py' -v
      - name: Inspect Ground closure without running the model
        run: |
          python -m mailcpu.ai_ground_atlas validate
          python -m mailcpu.ai_ground_atlas show forward.moe_expert
          python -m mailcpu.ai_ground_atlas closure operate.recovery
      - name: Install MailCPU with packaged Ground Atlas
        run: python -m pip install .
      - name: Confirm catalog works outside source checkout
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          python -m mailcpu.ai_ground_atlas validate
