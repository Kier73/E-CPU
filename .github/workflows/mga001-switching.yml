name: MGA-001-H nonlinear switching
on:
  pull_request:
    paths:
      - 'mailcpu/switching_affine_ground.py'
      - 'tests/test_switching_affine_ground.py'
      - 'experiments/mga001_switching_affine*'
      - '.github/workflows/mga001-switching.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  switching:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_switching_affine_ground.py -v
      - name: Reproduce exact campaign
        shell: bash
        run: |
          node experiments/mga001_switching_affine.js > "$RUNNER_TEMP/switching.json"
          diff --strip-trailing-cr -u experiments/mga001_switching_affine.json "$RUNNER_TEMP/switching.json"
