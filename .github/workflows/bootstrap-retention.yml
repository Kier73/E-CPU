name: BOOT-001B network retention
on:
  pull_request:
    paths:
      - 'mailcpu/bootstrap_retention.py'
      - 'mailcpu/computational_session.py'
      - 'tests/test_bootstrap_retention.py'
      - '.github/workflows/bootstrap-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_bootstrap_retention.py tests/test_bootstrap_001.py tests/test_computational_session.py tests/test_continuous_session.py
