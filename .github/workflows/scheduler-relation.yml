name: Scheduler state relation

on:
  pull_request:
  push:
    branches:
      - "feat/scheduler-state-relation-v0.1"

jobs:
  scheduler-relation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run exact scheduler relation tests
        run: python -m pytest -q tests/test_scheduler_relation.py
