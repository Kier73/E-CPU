name: CAPACITY-001 latent path recognition
on:
  pull_request:
    paths:
      - 'mailcpu/latent_path_capacity.py'
      - 'tests/test_latent_path_capacity.py'
      - 'examples/run_latent_path_capacity.py'
      - 'docs/LATENT_PATH_CAPACITY.md'
      - '.github/workflows/latent-path-capacity.yml'
  push:
    paths:
      - 'mailcpu/latent_path_capacity.py'
      - 'tests/test_latent_path_capacity.py'
      - 'examples/run_latent_path_capacity.py'
      - 'docs/LATENT_PATH_CAPACITY.md'
      - '.github/workflows/latent-path-capacity.yml'
permissions:
  contents: read
jobs:
  bounded-capacity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_latent_path_capacity.py tests/test_transit_path_modes.py tests/test_observer_path_evidence.py
      - run: python -m examples.run_latent_path_capacity