name: INTERNET-005 observed Internet Ground selection

on:
  push:
    branches: [research/internet-ground-routing-005-20261116]
    paths:
      - 'mailcpu/internet_ground_routing.py'
      - 'tests/test_internet_ground_routing.py'
      - 'examples/resolve_public_internet_ground.py'
      - 'docs/INTERNET_GROUND_ROUTING_005.md'
      - '.github/workflows/internet-ground-routing.yml'
  pull_request:
    paths:
      - 'mailcpu/internet_ground_routing.py'
      - 'tests/test_internet_ground_routing.py'
      - 'examples/resolve_public_internet_ground.py'
      - 'docs/INTERNET_GROUND_ROUTING_005.md'
      - '.github/workflows/internet-ground-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy-and-ground-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Native E-CPU resolver and discovery tests
        run: |
          python -m unittest discover -s tests -p 'test_internet_ground_routing.py' -v
          python -m pytest -q tests/test_evidence_path_resolver.py tests/test_active_ground_discovery.py

  live-rfc-intention:
    runs-on: ubuntu-latest
    needs: native-policy-and-ground-tests
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute INTERNET-004 real bounded HTTPS navigation
        run: |
          python examples/navigate_public_internet.py observe \
            --seed 9293 --target 793 --max-pages 4 --max-depth 2 \
            --file /tmp/internet-005-rfc.json
      - name: Route retained observation under native E-CPU authority
        run: |
          PIN=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/internet-005-rfc.json'))['capsule_digest'])
          PY
          )
          python examples/resolve_public_internet_ground.py \
            --file /tmp/internet-005-rfc.json --seed 9293 --target 793 \
            --max-pages 4 --max-depth 2 \
            --expected-capsule-sha256 "$PIN" \
            > /tmp/internet-005-native-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internet-005-captured-rfc-and-native-route
          path: |
            /tmp/internet-005-rfc.json
            /tmp/internet-005-native-plan.json
          if-no-files-found: warn
          retention-days: 7
